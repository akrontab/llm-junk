# --- Template (No ports or volumes here) ---
x-ollama-base: &ollama-base
  image: ollama/ollama:latest
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    default:
      aliases:
        - ollama_service

services:
  ollama-gpu:
    <<: *ollama-base
    container_name: ollama_service
    profiles: ["gpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-cpu:
    <<: *ollama-base
    container_name: ollama_service
    profiles: ["cpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  ollama-puller:
    image: ollama/ollama:latest
    container_name: ollama_puller
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - default
    entrypoint: /bin/sh -c "ollama serve & sleep 5 && ollama pull llama3.2:3b && ollama pull qwen3-embedding && pkill ollama & sleep 5"
    depends_on:
      - vector_store

  vector_store:
    image: qdrant/qdrant:latest
    container_name: vector_store
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - vector_store_storage:/qdrant/storage 

  dotnet-api:
    build:
      context: .
      dockerfile: MyAiApi/dockerfile
    container_name: dotnet_api
    environment:
      - AI_ENDPOINT=http://ollama_service:11434
      - ASPNETCORE_URLS=http://+:8080
      - VECTOR_STORE_ENDPOINT=http://vector_store:6333
    ports:
      - "5000:8080"
    depends_on:
      vector_store:
        condition: service_started
      ollama-puller:
        condition: service_completed_successfully

  file-watcher:
    build: 
      context: .
      dockerfile: MyFileWatcher/dockerfile
    container_name: file_watcher
    volumes:
      - ./ai-docs:/watch_folder 
    environment:
      - AI_UPLOAD_URL=http://dotnet-api:8080/upload
    depends_on:
      - dotnet-api

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: aspire-dashboard
    ports:
      - "18888:18888" 
      - "4317:18889" 
      - "4318:18890" 
    environment:
      - ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true

volumes:
  ollama_storage:
  vector_store_storage: